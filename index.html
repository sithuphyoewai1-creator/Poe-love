
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ပိုးလေးအတွက် 💗</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:16px;font-family:system-ui,sans-serif;color:#754257;
 background:linear-gradient(135deg,#f6b9db,#ffe7d7,#d8f1ce);
 overflow:hidden
}
.card{
 width:100%;max-width:430px;padding:22px 18px;
 border:3px solid #fff;border-radius:30px;text-align:center;
 background:#ffffffed;box-shadow:0 15px 45px #9b547329;
 position:relative;overflow:hidden
}
.tag{font-size:12px;color:#c45888;letter-spacing:1px}
h2{color:#cf4d83;font-size:23px;margin:8px 0}
#message{
 min-height:94px;padding:15px 13px;border-radius:20px;
 background:#fff1f7;line-height:2;font-size:14px;
 white-space:pre-line
}
.scene{
 height:230px;position:relative;overflow:hidden;
 border-radius:23px;margin:16px 0;
 background:linear-gradient(#fff4fa,#ffdfed);
 border-bottom:5px solid #efb1d0
}
.cloud{position:absolute;font-size:24px;animation:cloud 5s linear infinite}
.c1{top:18px;left:12%}.c2{top:44px;right:13%;animation-delay:2s}
@keyframes cloud{50%{transform:translateX(14px)}}
.character{
 position:absolute;bottom:7px;left:calc(50% - 48px);
 width:96px;height:132px;
 transition:left .9s ease,opacity .7s,transform .5s;
 z-index:2
}
.character.walk{animation:walk .28s ease-in-out infinite alternate}
@keyframes walk{
 from{transform:translateY(0) rotate(-2deg)}
 to{transform:translateY(-5px) rotate(2deg)}
}
.character.happy{animation:happy .5s ease-in-out 3}
@keyframes happy{
 0%,100%{transform:translateY(0) scale(1)}
 50%{transform:translateY(-18px) scale(1.05)}
}
.character.cry{animation:cry .18s ease-in-out infinite alternate}
@keyframes cry{
 from{transform:rotate(-4deg)}
 to{transform:rotate(4deg)}
}
.character.vanish{
 opacity:0;transform:translateY(-35px) scale(.5)
}
svg{width:100%;height:100%;overflow:visible}
.ground{
 position:absolute;bottom:3px;left:0;right:0;
 height:2px;background:#efb1d0
}
.letter{
 position:absolute;bottom:67px;left:calc(50% + 16px);
 font-size:35px;z-index:3;
 animation:letter 1.2s ease-in-out infinite alternate
}
@keyframes letter{
 from{transform:rotate(-8deg) translateY(0)}
 to{transform:rotate(8deg) translateY(-5px)}
}
.heart{
 position:absolute;left:50%;top:40%;font-size:35px;
 pointer-events:none;animation:heart 1.7s ease-out forwards;
 z-index:5
}
@keyframes heart{
 0%{opacity:0;transform:translate(-50%,20px) scale(.3)}
 25%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}
 100%{opacity:0;transform:translate(-50%,-125px) scale(.8)}
}
.dots{display:flex;justify-content:center;gap:7px;margin:12px}
.dot{width:8px;height:8px;border-radius:9px;background:#f1c9dc}
.dot.on{width:24px;background:#d9568b}
.buttons{display:flex;gap:10px;margin-top:17px}
button{
 flex:1;border:0;border-radius:15px;padding:13px 7px;
 font-size:14px;font-weight:bold;cursor:pointer;
 transition:transform .15s
}
button:active{transform:scale(.96)}
.yes{background:#e85d97;color:white;box-shadow:0 5px 12px #e85d9730}
.no{background:#fbe7ef;color:#995b77}
#status{font-size:12px;margin-top:10px;min-height:18px;color:#b35b81}
footer{font-size:11px;line-height:1.8;margin-top:13px;color:#a4778b}
</style>
</head>
<body>
<main class="card">
 <div class="tag">♡ A LITTLE LETTER FOR POE ♡</div>
 <h2 id="title">ပိုးရေ… 💗</h2>

 <div class="scene" id="scene">
  <span class="cloud c1">☁️</span>
  <span class="cloud c2">☁️</span>

  <div class="character walk" id="character">
   <svg viewBox="0 0 100 140" aria-label="ချစ်စရာ အဖြူရောင်ကာတွန်းလေး">
    <g id="body">
     <path d="M22 38 Q8 8 25 8 Q39 7 45 24 Q53 20 62 24 Q76 5 88 15 Q98 26 83 44 Q94 63 83 83 L82 116 Q84 133 73 133 L27 133 Q16 133 19 117 L18 84 Q5 65 22 38Z"
       fill="white" stroke="#553628" stroke-width="4.5" stroke-linejoin="round"/>
     <path d="M23 25 Q29 17 36 29" fill="none" stroke="#f3a7a2" stroke-width="7" stroke-linecap="round"/>
     <path d="M71 28 Q80 17 86 26" fill="none" stroke="#f3a7a2" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g id="face">
     <path d="M29 58 Q35 46 45 58 Q38 66 29 58Z" fill="#553628"/>
     <path d="M57 58 Q66 46 73 58 Q65 66 57 58Z" fill="#553628"/>
     <ellipse cx="22" cy="72" rx="7" ry="4" fill="#ffc3cf"/>
     <ellipse cx="80" cy="72" rx="7" ry="4" fill="#ffc3cf"/>
     <path d="M44 68 Q50 77 56 68" fill="none" stroke="#553628" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="tears" opacity="0">
     <path d="M34 65 Q26 78 34 79 Q42 77 34 65Z" fill="#70c9ff"/>
     <path d="M68 65 Q60 78 68 79 Q76 77 68 65Z" fill="#70c9ff"/>
    </g>
    <path d="M30 112 Q25 124 32 125 M70 112 Q77 124 70 125"
      fill="none" stroke="#553628" stroke-width="4" stroke-linecap="round"/>
   </svg>
  </div>

  <div class="letter" id="letter">💌</div>
  <div class="ground"></div>
 </div>

 <div class="dots">
  <span class="dot on" id="d1"></span>
  <span class="dot" id="d2"></span>
  <span class="dot" id="d3"></span>
 </div>

 <div id="step" class="tag">အဆင့် ၁ / ၃</div>
 <div id="message">အကောင်လေးက ပိုးအတွက် စာလေးယူလာတယ်။ 💌</div>

 <div class="buttons" id="buttons">
  <button class="yes" id="yes">စာလေးလက်ခံမယ် 💗</button>
  <button class="no" id="no">အခုမယူသေးဘူး 🥺</button>
 </div>

 <div id="status"></div>
 <footer>ပိုးရဲ့ခံစားချက်ကို လေးစားပါတယ် ♡</footer>
</main>

<script>
const endpoint="https://formspree.io/f/xeaekzwy";
let page=1,answers={},busy=false;

const data=[
 {},
 {
  title:"ပိုးရေ… 💗",
  message:"အကောင်လေးက ပိုးအတွက် စာလေးယူလာတယ်။ 💌",
  yes:"စာလေးလက်ခံမယ် 💗",
  no:"အခုမယူသေးဘူး 🥺"
 },
 {
  title:"ခွင့်လွှတ်ပေးနိုင်မလား 🥺",
  message:"ခဏခဏ Block လုပ်မိခဲ့တာ ကိုယ့်အမှားပါ။ တကယ်တောင်းပန်ပါတယ်။ စိတ်မကောင်းဖြစ်တဲ့အချိန်မှာ အေးအေးဆေးဆေး ဖြေရှင်းဖို့ ကိုယ် ပိုကြိုးစားပါမယ်။ 💗",
  yes:"ခွင့်လွှတ်မယ် 💞",
  no:"အခုတော့ မလွှတ်နိုင်သေးဘူး"
 },
 {
  title:"ကိုယ့်ကို ချစ်သေးလား 🌷",
  message:"ကိုယ်ကတော့ ပိုးကို ချစ်နေသေးတယ်။ ဒါပေမဲ့ ပိုးရဲ့ခံစားချက်ကိုလည်း လေးစားပါတယ်။ ရိုးရိုးသားသား ဖြေပေးနော်။ 💗",
  yes:"ချစ်သေးတယ် 💗",
  no:"မချစ်တော့ဘူး 🤍"
 }
];

const $=id=>document.getElementById(id);
const character=$("character");

function render(){
 const p=data[page];
 $("step").textContent="အဆင့် "+page+" / ၃";
 $("title").textContent=p.title;
 $("message").textContent=p.message;
 $("yes").textContent=p.yes;
 $("no").textContent=p.no;
 for(let i=1;i<=3;i++) $("d"+i).classList.toggle("on",i===page);
 $("buttons").style.display="flex";
 $("letter").style.display=page===1?"block":"none";
 $("status").textContent="";
 $("yes").onclick=()=>choose(true);
 $("no").onclick=()=>choose(false);
}

function hearts(){
 for(let i=0;i<9;i++){
  const h=document.createElement("span");
  h.className="heart";
  h.textContent=["💗","💕","💖","❤️","✨"][i%5];
  h.style.left=(15+Math.random()*70)+"%";
  h.style.animationDelay=(Math.random()*.8)+"s";
  $("scene").appendChild(h);
  setTimeout(()=>h.remove(),2600);
 }
}

function endScreen(title,msg,crying){
 character.classList.remove("walk","happy","cry");
 if(crying){
  character.classList.add("cry");
  $("tears").setAttribute("opacity","1");
  $("face").innerHTML=
   '<path d="M29 57 Q37 50 45 57" fill="none" stroke="#553628" stroke-width="4" stroke-linecap="round"/>'+
   '<path d="M57 57 Q66 50 73 57" fill="none" stroke="#553628" stroke-width="4" stroke-linecap="round"/>'+
   '<path d="M43 77 Q50 69 57 77" fill="none" stroke="#553628" stroke-width="3" stroke-linecap="round"/>';
 }else{
  character.classList.add("happy");
  $("face").innerHTML=
   '<path d="M29 58 Q35 46 45 58 Q38 66 29 58Z" fill="#553628"/>'+
   '<path d="M57 58 Q66 46 73 58 Q65 66 57 58Z" fill="#553628"/>'+
   '<path d="M42 67 Q50 80 58 67" fill="none" stroke="#553628" stroke-width="3" stroke-linecap="round"/>'+
   '<ellipse cx="22" cy="72" rx="7" ry="4" fill="#ffc3cf"/>'+
   '<ellipse cx="80" cy="72" rx="7" ry="4" fill="#ffc3cf"/>';
 }
 $("title").textContent=title;
 $("message").textContent=msg;
 $("buttons").style.display="none";
 $("letter").style.display="none";
 $("status").textContent="";

 setTimeout(()=>{
  hearts();
  character.classList.add("vanish");
  const h=document.createElement("span");
  h.className="heart";
  h.textContent="💗";
  h.style.fontSize="54px";
  h.style.left="50%";
  h.style.top="32%";
  $("scene").appendChild(h);
  setTimeout(()=>h.remove(),1800);
 },900);
}

async function sendAnswers(){
 try{
  const r=await fetch(endpoint,{
   method:"POST",
   headers:{"Content-Type":"application/json","Accept":"application/json"},
   body:JSON.stringify({
    subject:"ပိုးရဲ့အဖြေ 💗",
    ...answers,
    submitted_at:new Date().toISOString()
   })
  });
  return r.ok;
 }catch(e){return false}
}

async function choose(answer){
 if(busy)return;
 busy=true;
 answers["အဆင့် "+page]=answer?data[page].yes:data[page].no;

 if(page===1&&!answer){
  endScreen("ရပါတယ် ပိုးရေ 🌷",
   "အခုမယူချင်လည်း ရပါတယ်။ ပိုးရဲ့ဆုံးဖြတ်ချက်ကို လေးစားပါတယ်။",true);
  const ok=await sendAnswers();
  $("status").textContent=ok?"အဖြေပို့ပြီးပါပြီ 💌":"အဖြေပို့မရသေးပါ။";
  return;
 }

 if(page===1&&answer){
  character.classList.remove("walk");
  character.classList.add("happy");
  $("letter").textContent="💗";
  hearts();
  $("message").textContent="ပိုးက စာလေးလက်ခံလိုက်ပြီ! အကောင်လေး အရမ်းဝမ်းသာသွားတယ်။ 🥰";
  $("buttons").style.display="none";
  setTimeout(()=>{page=2;character.classList.remove("happy");render();busy=false},1900);
  return;
 }

 if(page===2){
  character.classList.remove("walk");
  if(answer){character.classList.add("happy");hearts()}
  else character.classList.add("cry");
  $("buttons").style.display="none";
  $("message").textContent=answer?
   "ကျေးဇူးပါ ပိုးရေ။ ကိုယ် ပိုကောင်းအောင် ကြိုးစားပါမယ်။ 💗":
   "နားလည်ပါတယ် ပိုးရေ။ ကိုယ် အချိန်ပေးပြီး ပိုကောင်းအောင် ကြိုးစားပါမယ်။ 🌷";
  setTimeout(()=>{page=3;character.classList.remove("happy","cry");render();busy=false},2000);
  return;
 }

 endScreen(answer?"ပျော်လိုက်တာ 💗":"ရိုးသားပေးလို့ ကျေးဇူးပါ 🤍",
  answer?
  "ပိုးရဲ့အဖြေအတွက် ကျေးဇူးပါ။ 💗 အကောင်လေးက အသည်းလေးပေးပြီး သွားတော့မယ်နော်။":
  "ပိုးရဲ့ခံစားချက်ကို လေးစားပါတယ်။ အကောင်လေးက အသည်းလေးပေးပြီး နှုတ်ဆက်သွားတယ်။",!answer);
 $("status").textContent="အဖြေပို့နေပါတယ်…";
 const ok=await sendAnswers();
 $("status").textContent=ok?
  "အဖြေ ပို့ပြီးပါပြီ 💌":"အဖြေပို့မရသေးပါ။ Formspree ကို စစ်ကြည့်ပါနော်။";
}
render();
</script>
</body>
</html>
